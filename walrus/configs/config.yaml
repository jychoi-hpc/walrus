defaults:
  - _self_
  - trainer: defaults
  - optimizer: adam
  - lr_scheduler: inv_sqrt_w_linear_ramps
  - model: isotropic_model
  - data: all_2d
  - experiment: defaults
  - server: ???
  - distribution: local
  - logger: wandb
  - checkpoint: defaults
  - finetuning_mods: defaults
data_workers: 14
name: default_name
seed: # Optional: seed torch and numpy before building data and model (reproducible runs)
ddstore: # Serve training fields from DDStore (nodes' host memory over libfabric RDMA) instead of the files
  enabled: false
  workers: 2 # threads running the training loader (ThreadDataLoader; no forked workers with DDStore), one batch ahead each; a batch is a full sample in host memory
  reuse_buffers: true # each loader thread reads into its own buffer, registered with the network once
finetune: False
automatic_setup: True
